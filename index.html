<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Todo</h1>
      <p class="subtitle" id="subtitle">やることを整理しよう</p>
    </header>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="新しいタスクを入力..."
        autocomplete="off"
        maxlength="200"
      />
      <select id="priority-select" aria-label="優先度">
        <option value="low">低</option>
        <option value="medium" selected>中</option>
        <option value="high">高</option>
      </select>
      <input type="date" id="due-input" aria-label="期限" />
      <button type="submit">追加</button>
    </form>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="フィルター">
        <button class="filter-btn active" data-filter="all">すべて</button>
        <button class="filter-btn" data-filter="active">未完了</button>
        <button class="filter-btn" data-filter="completed">完了済み</button>
      </div>
      <button id="clear-completed" class="clear-btn">完了済みを削除</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty-state" hidden>タスクがありません</p>

    <footer class="app-footer">
      <span id="items-left">0 件残り</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
