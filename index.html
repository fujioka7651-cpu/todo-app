<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Todo</h1>
      <p class="subtitle" id="subtitle">やることを整理しよう</p>
    </header>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="新しいタスクを入力..."
        autocomplete="off"
        maxlength="200"
      />
      <select id="priority-select" aria-label="優先度">
        <option value="low">低</option>
        <option value="medium" selected>中</option>
        <option value="high">高</option>
      </select>
      <input type="date" id="due-input" aria-label="期限" />
      <button type="submit">追加</button>
    </form>

    <div class="toolbar">
      <div class="view-toggle" role="group" aria-label="表示切り替え">
        <button class="view-btn active" data-view="list">リスト</button>
        <button class="view-btn" data-view="calendar">カレンダー</button>
      </div>
      <div class="filters" id="filters" role="group" aria-label="フィルター">
        <button class="filter-btn active" data-filter="all">すべて</button>
        <button class="filter-btn" data-filter="active">未完了</button>
        <button class="filter-btn" data-filter="completed">完了済み</button>
      </div>
      <button id="clear-completed" class="clear-btn">完了済みを削除</button>
    </div>

    <section id="list-view">
      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty-state" class="empty-state" hidden>タスクがありません</p>
    </section>

    <section id="calendar-view" hidden>
      <div class="calendar-header">
        <button id="calendar-prev" class="calendar-nav-btn" aria-label="前月">‹</button>
        <div class="calendar-header-center">
          <span id="calendar-label" class="calendar-label"></span>
          <button id="calendar-today" class="calendar-today-btn">今日</button>
        </div>
        <button id="calendar-next" class="calendar-nav-btn" aria-label="次月">›</button>
      </div>
      <div class="calendar-weekdays">
        <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>

      <div class="no-due-section">
        <h2 class="no-due-heading">期限なし</h2>
        <ul id="no-due-list" class="todo-list"></ul>
      </div>
    </section>

    <footer class="app-footer">
      <span id="items-left">0 件残り</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
